<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écran de lancement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rs.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
#lancement{display:grid;place-items:center;width:375px;height:812px;background:var(--papier);color:var(--encre);--accent:var(--saison-texte);--doux:var(--encre-2)}
.l-centre{display:flex;flex-direction:column;align-items:center;gap:18px}
.l-titre{margin:0;font:400 42px/1 'Young Serif',Georgia,serif;letter-spacing:-.015em;text-align:center}
.l-titre .l-ligne{display:block;color:var(--accent)}
.l-mois{margin:0;font:700 13px/1 'Sofia Sans Extra Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--doux)}
.p-hiver,.p-printemps,.p-ete,.p-automne{display:none}
.hiver .p-hiver,.printemps .p-printemps,.ete .p-ete,.automne .p-automne{display:inline}
/* Boucle de 4,2 s pour la maquette ; dans l'app la scène ne joue qu'une fois. */
</style>
</helmet>
<div class="ecran {{saison}} {{theme}}" style="width: 375px; height: 812px">
  <div id="lancement" role="img" aria-label="Écran de lancement : les pages de l'année se tournent jusqu'à la saison en cours, ses produits tombent dans le bol, puis le titre arrive lettre par lettre">
    <div class="l-centre">
      <!-- logo:debut (généré par scripts/dessiner-logo.mjs) -->
      <style>
.l-feuillet { position: relative; width: 136px; height: 136px; margin-bottom: 2px; perspective: 520px; }
.l-feuillet > svg:not([width]) { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
