<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recettes de saison</title>
    <!-- Site privé : ne pas indexer dans les moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="theme-color" content="#EEF0E7" />
    <link rel="icon" href="/icones/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="De saison" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Saison et apparence posées avant le premier affichage : l'accent et le mode sont justes dès l'écran de lancement.
      // Même règle que src/lib/apparence.ts : choix des réglages, sinon celui du téléphone.
      (function () {
        var racine = document.documentElement;
        var m = new Date().getMonth() + 1;
        racine.classList.add(m === 12 || m <= 2 ? 'hiver' : m <= 5 ? 'printemps' : m <= 8 ? 'ete' : 'automne');
        var choix = null;
        try { choix = localStorage.getItem('recettes-de-saison:apparence'); } catch (e) {}
        var sombre = choix === 'sombre' || (choix !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        racine.dataset.theme = sombre ? 'sombre' : 'clair';
        if (sombre) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161217');
      })();
    </script>
    <style>
      /* Écran de lancement : en ligne pour s'afficher avant le JavaScript.
         Les pages de l'année se tournent jusqu'à la saison en cours (bloc généré plus bas). */
      #lancement {
        --fond: #eef0e7; --encre: #221a20; --doux: #5a5158; --accent: #a9480f;
        --l-hiver: #6e2a63; --l-printemps: #3b6b1f; --l-ete: #b3261e; --l-automne: #a9480f; --l-encre: #221a20; --l-fond: #eef0e7;
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--fond); color: var(--encre);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .hiver #lancement { --accent: #6e2a63; }
      .printemps #lancement { --accent: #3b6b1f; }
      .ete #lancement { --accent: #b3261e; }
      [data-theme='sombre'] #lancement {
        --fond: #161217; --encre: #eceae1; --doux: #ada5ad; --accent: #f09a5b;
        --l-hiver: #d9a0cc; --l-printemps: #a6d17e; --l-ete: #f2877c; --l-automne: #f09a5b; --l-encre: #eceae1; --l-fond: #161217;
      }
      [data-theme='sombre'].hiver #lancement { --accent: #d9a0cc; }
      [data-theme='sombre'].printemps #lancement { --accent: #a6d17e; }
      [data-theme='sombre'].ete #lancement { --accent: #f2877c; }
      #lancement.fin { opacity: 0; transform: translateY(-6px); }
      .l-centre { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .l-titre { margin: 0; font: 400 42px/1 'Young Serif', Georgia, serif; letter-spacing: -0.015em; text-align: center; }
      .l-titre .l-ligne { display: block; color: var(--accent); }
      .l-mois {
        margin: 0; font: 700 13px/1 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--doux);
      }
      .l-masque { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) {
        #lancement { transition-duration: 0.12s; }
        #lancement.fin { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="lancement" role="status">
      <div class="l-centre">
        <!-- logo:debut (généré par scripts/dessiner-logo.mts) -->
        <style>
.l-cadran { width: 132px; height: 132px; margin-bottom: 4px; overflow: visible; }
.l-cadran .l-seg, .l-cadran .l-seg-plein { transform-box: view-box; transform-origin: 128px 128px; }
.l-cadran .l-seg-plein { opacity: 0; }
.l-cadran .l-seg.courant .l-seg-plein { opacity: 1; }
.l-cadran .l-cuillere { --arrivee: 300deg; --depart: -60deg; transform-box: view-box; transform-origin: 128px 128px; transform: rotate(var(--arrivee)); }
.l-titre .l-mot { display: inline-block; white-space: nowrap; }
.l-titre .l { display: inline-block; transform-origin: 50% 100%; }
.l-cadran { animation: l-pose 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.l-cadran .l-seg { animation: l-seg 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) calc(0.04s + var(--k) * 0.035s) both; }
.l-cadran .l-cuillere { animation: l-tour 0.95s cubic-bezier(0.45, 0, 0.2, 1.12) 0.22s both; }
.l-cadran .l-seg.courant .l-seg-plein { animation: l-gonfle 0.38s ease-out 1.08s both; }
.l-titre .l { animation: l-lettre 0.62s ease-out calc(0.62s + var(--i) * 0.03s) both; }
.l-mois { animation: l-monte 0.4s ease-out 1.3s both; }
@keyframes l-pose { 0% { opacity:0;transform:scale(0.92); } 100% { opacity:1;transform:none; } }
@keyframes l-seg { 0% { opacity:0;transform:scale(0.72); } 100% { opacity:1;transform:none; } }
@keyframes l-tour { 0% { transform:rotate(var(--depart)); } 100% { transform:rotate(var(--arrivee)); } }
@keyframes l-gonfle { 0% { opacity:0;transform:scale(0.9); } 60% { opacity:1;transform:scale(1.04); } 100% { opacity:1;transform:none; } }
@keyframes l-lettre { 0% { opacity:0;transform:translateY(-0.7em); } 42% { opacity:1;transform:translateY(0.05em) scale(1.08,0.86); } 64% { transform:translateY(-0.16em) scale(0.97,1.04); } 84% { transform:translateY(0.02em) scale(1.01,0.99); } 100% { opacity:1;transform:none; } }
@keyframes l-monte { 0% { opacity:0;transform:translateY(8px); } 100% { opacity:1;transform:none; } }
@media (prefers-reduced-motion: reduce) { .l-cadran, .l-cadran *, .l-titre .l, .l-mois { animation: none !important; } }
</style>
        <svg class="l-cadran" viewBox="0 0 256 256" aria-hidden="true"><g class="l-seg" data-mois="1" style="--k:0"><path d="M161.39 16.91A116 116 0 0 1 207.51 43.54L194.78 56.27A98 98 0 0 0 156.73 34.31Z" style="fill:var(--l-hiver)"/><path class="l-seg-plein" d="M164.5 5.31A128 128 0 0 1 216 35.05L189.82 61.23A91 91 0 0 0 154.92 41.07Z" style="fill:var(--l-hiver)"/></g><g class="l-seg" data-mois="2" style="--k:1"><path d="M212.46 48.49A116 116 0 0 1 239.09 94.61L221.69 99.27A98 98 0 0 0 199.73 61.22Z" style="fill:var(--l-hiver)"/><path class="l-seg-plein" d="M220.95 40A128 128 0 0 1 250.69 91.5L214.93 101.08A91 91 0 0 0 194.77 66.18Z" style="fill:var(--l-hiver)"/></g><g class="l-seg" data-mois="3" style="--k:2"><path d="M240.9 101.37A116 116 0 0 1 240.9 154.63L223.51 149.97A98 98 0 0 0 223.51 106.03Z" style="fill:var(--l-printemps)"/><path class="l-seg-plein" d="M252.5 98.26A128 128 0 0 1 252.5 157.74L216.74 148.15A91 91 0 0 0 216.74 107.85Z" style="fill:var(--l-printemps)"/></g><g class="l-seg" data-mois="4" style="--k:3"><path d="M239.09 161.39A116 116 0 0 1 212.46 207.51L199.73 194.78A98 98 0 0 0 221.69 156.73Z" style="fill:var(--l-printemps)"/><path class="l-seg-plein" d="M250.69 164.5A128 128 0 0 1 220.95 216L194.77 189.82A91 91 0 0 0 214.93 154.92Z" style="fill:var(--l-printemps)"/></g><g class="l-seg" data-mois="5" style="--k:4"><path d="M207.51 212.46A116 116 0 0 1 161.39 239.09L156.73 221.69A98 98 0 0 0 194.78 199.73Z" style="fill:var(--l-printemps)"/><path class="l-seg-plein" d="M216 220.95A128 128 0 0 1 164.5 250.69L154.92 214.93A91 91 0 0 0 189.82 194.77Z" style="fill:var(--l-printemps)"/></g><g class="l-seg" data-mois="6" style="--k:5"><path d="M154.63 240.9A116 116 0 0 1 101.37 240.9L106.03 223.51A98 98 0 0 0 149.97 223.51Z" style="fill:var(--l-ete)"/><path class="l-seg-plein" d="M157.74 252.5A128 128 0 0 1 98.26 252.5L107.85 216.74A91 91 0 0 0 148.15 216.74Z" style="fill:var(--l-ete)"/></g><g class="l-seg" data-mois="7" style="--k:6"><path d="M94.61 239.09A116 116 0 0 1 48.49 212.46L61.22 199.73A98 98 0 0 0 99.27 221.69Z" style="fill:var(--l-ete)"/><path class="l-seg-plein" d="M91.5 250.69A128 128 0 0 1 40 220.95L66.18 194.77A91 91 0 0 0 101.08 214.93Z" style="fill:var(--l-ete)"/></g><g class="l-seg" data-mois="8" style="--k:7"><path d="M43.54 207.51A116 116 0 0 1 16.91 161.39L34.31 156.73A98 98 0 0 0 56.27 194.78Z" style="fill:var(--l-ete)"/><path class="l-seg-plein" d="M35.05 216A128 128 0 0 1 5.31 164.5L41.07 154.92A91 91 0 0 0 61.23 189.82Z" style="fill:var(--l-ete)"/></g><g class="l-seg" data-mois="9" style="--k:8"><path d="M15.1 154.63A116 116 0 0 1 15.1 101.37L32.49 106.03A98 98 0 0 0 32.49 149.97Z" style="fill:var(--l-automne)"/><path class="l-seg-plein" d="M3.5 157.74A128 128 0 0 1 3.5 98.26L39.26 107.85A91 91 0 0 0 39.26 148.15Z" style="fill:var(--l-automne)"/></g><g class="l-seg" data-mois="10" style="--k:9"><path d="M16.91 94.61A116 116 0 0 1 43.54 48.49L56.27 61.22A98 98 0 0 0 34.31 99.27Z" style="fill:var(--l-automne)"/><path class="l-seg-plein" d="M5.31 91.5A128 128 0 0 1 35.05 40L61.23 66.18A91 91 0 0 0 41.07 101.08Z" style="fill:var(--l-automne)"/></g><g class="l-seg" data-mois="11" style="--k:10"><path d="M48.49 43.54A116 116 0 0 1 94.61 16.91L99.27 34.31A98 98 0 0 0 61.22 56.27Z" style="fill:var(--l-automne)"/><path class="l-seg-plein" d="M40 35.05A128 128 0 0 1 91.5 5.31L101.08 41.07A91 91 0 0 0 66.18 61.23Z" style="fill:var(--l-automne)"/></g><g class="l-seg" data-mois="12" style="--k:11"><path d="M101.37 15.1A116 116 0 0 1 154.63 15.1L149.97 32.49A98 98 0 0 0 106.03 32.49Z" style="fill:var(--l-hiver)"/><path class="l-seg-plein" d="M98.26 3.5A128 128 0 0 1 157.74 3.5L148.15 39.26A91 91 0 0 0 107.85 39.26Z" style="fill:var(--l-hiver)"/></g><g class="l-cuillere" style="fill:var(--l-encre);" transform="rotate(300 128 128)"><ellipse cx="128" cy="72" rx="21" ry="27"/><path d="M121.5 95C122.5 110 121.5 146 120.5 170a7.5 7.5 0 0 0 15 0C134.5 146 133.5 110 134.5 95Z"/><circle cx="128" cy="128" r="15"/><path d="M118.5 61C120.5 55 123.5 52 128 51" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/></g><circle cx="128" cy="128" r="5.5" style="fill:var(--l-fond)"/></svg>
        <p class="l-titre" aria-hidden="true"><span class="l-mot"><span class="l" style="--i:0">R</span><span class="l" style="--i:1">e</span><span class="l" style="--i:2">c</span><span class="l" style="--i:3">e</span><span class="l" style="--i:4">t</span><span class="l" style="--i:5">t</span><span class="l" style="--i:6">e</span><span class="l" style="--i:7">s</span></span><span class="l-ligne"><span class="l-mot"><span class="l" style="--i:8">d</span><span class="l" style="--i:9">e</span></span> <span class="l-mot"><span class="l" style="--i:10">s</span><span class="l" style="--i:11">a</span><span class="l" style="--i:12">i</span><span class="l" style="--i:13">s</span><span class="l" style="--i:14">o</span><span class="l" style="--i:15">n</span></span></span></p>
        <!-- logo:fin -->
        <p class="l-mois" id="lancement-mois" aria-hidden="true"></p>
        <span class="l-masque">Chargement de vos recettes…</span>
      </div>
    </div>
    <script>
      (function () {
        var mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        var noms = { hiver: 'hiver', printemps: 'printemps', ete: 'été', automne: 'automne' };
        var m = new Date().getMonth() + 1;
        document.getElementById('lancement-mois').textContent = mois[m - 1] + ' · ' + noms[document.documentElement.classList[0]];
        // Le cadran montre le mois en cours : son segment s'épaissit, la cuillère s'y arrête.
        var segment = document.querySelector('.l-seg[data-mois="' + m + '"]');
        if (segment) segment.classList.add('courant');
        var cuillere = document.querySelector('.l-cuillere');
        if (cuillere) {
          cuillere.style.setProperty('--arrivee', 30 * m + 'deg');
          cuillere.style.setProperty('--depart', 30 * m - 360 + 'deg');
        }
      })();
    </script>
    <div id="app" inert></div>
    <noscript>Recettes de saison a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
