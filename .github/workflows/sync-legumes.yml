name: Synchro des légumes

on:
  schedule:
    - cron: '17 5 1 * *' # le 1er de chaque mois, 5 h 17 UTC
  workflow_dispatch:

permissions:
  contents: write # committer legumes.json
  actions: write # relancer le déploiement

concurrency:
  group: synchro-legumes
  cancel-in-progress: false

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Récupérer les saisons (ADEME, METRO)
        run: node scripts/fetch-legumes.mjs

      - name: Committer si les données ont changé
        id: commit
        run: |
          git add public/legumes.json public/legumes
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "change=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(legumes): synchro mensuelle des saisons"
            git push
            echo "change=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec GITHUB_TOKEN ne déclenche aucun autre workflow :
      # on lance donc le déploiement explicitement.
      - name: Redéployer le site
        if: steps.commit.outputs.change == 'true' && hashFiles('.github/workflows/deploy.yml') != ''
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
