<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Ma semaine</title><desc>Trois soirs de la semaine, tous de saison ; le repas de mardi est changé seul : « Poulet rôti et haricots verts » devient « Poulet aux raisins ».</desc><style>
.titre{font-family:'Young Serif',Georgia,'Times New Roman',serif;fill:#221a20}
.etiq{font-family:'Sofia Sans Extra Condensed','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;font-weight:700;letter-spacing:.08em;fill:#5a5158}
.sans{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#5a5158}
.fort{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#221a20;font-weight:600}
.monte{animation:monte .4s ease-out both}
.saute{transform-box:fill-box;transform-origin:50% 100%;animation:saute .5s cubic-bezier(.34,1.56,.64,1) both}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes monte{0%{opacity:0;transform:translateY(8px)}}
@keyframes saute{0%{opacity:0;transform:translateY(-12px) scale(.9)}55%{opacity:1;transform:translateY(2px) scale(1.05,.95)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scaleY(.2)}}

.swapA{animation:swapA 7s ease-in-out 1.6s infinite both}
.swapB{opacity:0;animation:swapB 7s ease-in-out 1.6s infinite both}
.turn{transform-box:fill-box;transform-origin:50% 50%;animation:turn 7s cubic-bezier(.45,0,.2,1.1) 1.6s infinite both}
@keyframes swapA{0%,40%{opacity:1;transform:none}46%,90%{opacity:0;transform:translateY(-6px)}96%,100%{opacity:1;transform:none}}
@keyframes swapB{0%,40%{opacity:0;transform:translateY(6px)}46%,90%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(6px)}}
@keyframes turn{0%,36%{transform:rotate(0)}46%,86%{transform:rotate(360deg)}96%,100%{transform:rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><rect x=".5" y=".5" width="599" height="339" rx="18" fill="#f9faf5" stroke="#d6d9cd"/><text x="28" y="40" class="etiq" font-size="14">MA SEMAINE</text><text x="28" y="78" class="titre" font-size="28" letter-spacing="-.3">De saison d’abord</text><text x="28" y="106" class="sans" font-size="15">Les repas se composent avec ce qui est de saison ce mois-ci.</text><text x="28" y="127" class="sans" font-size="15">On garde un repas, on en change un seul, on régénère le reste.</text><g class="saute" style="animation-delay:0.30s"><rect x="28" y="150" width="544" height="54" rx="14" fill="#fff" stroke="#d6d9cd" stroke-opacity="1"/><text x="44" y="184" font-family="'Young Serif',Georgia,'Times New Roman',serif" font-size="22" fill="#5a5158">26</text><text x="76" y="183" class="etiq" font-size="12.5">LUNDI</text><text x="160" y="183" class="titre" font-size="17">Pâtes au pesto et courgettes</text><g transform="translate(438.0 161.0) scale(0.2857)"><g stroke="#1E3B36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 84 C16 80 18 74 24 70 L74 30 C80 26 88 26 90 32 C92 38 88 44 82 48 L32 88 C28 92 22 90 20 84Z" fill="#2f6b3a" stroke-width="4"/><path d="M80 30 L92 18 L98 22 L88 36Z" fill="#7a8f4a" stroke-width="3"/><circle cx="34" cy="74" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="46" cy="64" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="58" cy="54" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="70" cy="44" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="40" cy="78" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="52" cy="68" r="1.6" fill="#8cc56f" stroke="none"/><circle cx="64" cy="58" r="1.6" fill="#8cc56f" stroke="none"/><path d="M30 72 L72 38" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/><path d="M18 84 C14 86 14 92 20 92 C24 92 26 90 24 86Z" fill="#d9e88a" stroke-width="3"/></g></g><g transform="translate(520 165)" opacity=".35