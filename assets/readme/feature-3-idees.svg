<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Idées de saison</title><desc>Trois idées d’octobre cochées une à une : sardines au four et courgettes, risotto à la courge, poêlée de blettes et pois chiches.</desc><style>
.titre{font-family:'Young Serif',Georgia,'Times New Roman',serif;fill:#221a20}
.etiq{font-family:'Sofia Sans Extra Condensed','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;font-weight:700;letter-spacing:.08em;fill:#5a5158}
.sans{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#5a5158}
.fort{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#221a20;font-weight:600}
.monte{animation:monte .4s ease-out both}
.saute{transform-box:fill-box;transform-origin:50% 100%;animation:saute .5s cubic-bezier(.34,1.56,.64,1) both}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes monte{0%{opacity:0;transform:translateY(8px)}}
@keyframes saute{0%{opacity:0;transform:translateY(-12px) scale(.9)}55%{opacity:1;transform:translateY(2px) scale(1.05,.95)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scaleY(.2)}}

.tick{stroke-dasharray:1 1;stroke-dashoffset:0;animation:tick 7s ease-out infinite both}
.box{animation:box 7s linear infinite both}
@keyframes tick{0%{stroke-dashoffset:1}6%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes b0{0%,8%{fill:#fff;stroke:#7e8076}10%,92%{fill:#221a20;stroke:#221a20}100%{fill:#fff;stroke:#7e8076}}@keyframes c0{0%,8%{stroke-dashoffset:1}13%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@keyframes b1{0%,17%{fill:#fff;stroke:#7e8076}19%,92%{fill:#221a20;stroke:#221a20}100%{fill:#fff;stroke:#7e8076}}@keyframes c1{0%,17%{stroke-dashoffset:1}22%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@keyframes b2{0%,26%{fill:#fff;stroke:#7e8076}28%,92%{fill:#221a20;stroke:#221a20}100%{fill:#fff;stroke:#7e8076}}@keyframes c2{0%,26%{stroke-dashoffset:1}31%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><rect x=".5" y=".5" width="599" height="339" rx="18" fill="#f9faf5" stroke="#d6d9cd"/><text x="28" y="40" class="etiq" font-size="14">IDÉES DE SAISON</text><text x="28" y="78" class="titre" font-size="28" letter-spacing="-.3">135 idées, au moins 35 par mois</text><text x="28" y="106" class="sans" font-size="15">Des plats pleinement de saison ce mois-ci, faits avec les produits</text><text x="28" y="127" class="sans" font-size="15">de l’app : celles qu’on coche rejoignent le carnet.</text><g class="saute" style="animation-delay:0.25s"><rect x="28" y="146" width="544" height="52" rx="14" fill="#fff" stroke="#d6d9cd"/><g transform="translate(40.0 154.0) scale(0.3214)"><g stroke="#1E3B36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><defs><clipPath id="c-sardine"><path d="M8 58 C20 44 46 40 70 44 C80 46 86 50 90 53 L104 42 L100 58 L104 74 L90 63 C86 66 80 70 70 72 C46 76 20 72 8 58Z"/></clipPath></defs><path d="M54 44 L60 34 L70 44Z" fill="#4F7FA8" stroke-width="3"/><path d="M40 70 L46 78 L52 71Z" fill="#C9CDBF" stroke-width="3"/><path d="M8 58 C20 44 46 40 70 44 C80 46 86 50 90 53 L104 42 L100 58 L104 74 L90 63 C86 66 80 70 70 72 C46 76 20 72 8 58Z" fill="#E3E6DA" stroke="none"/><g clip-path="url(#c-sardine)"><path d="M0 0 H112 V55 C80 51 40 51 0 59 Z" fill="#4F7FA8" stroke="none"/></g><path d="M8 58 C20 44 46 40 70 44 C80 46 86 50 90 53 L104 42 L100 58 L104 74 L90 63 C86 66 80 70 70 72 C46 76 20 72 8 58Z" fill="none"/><path d="M30 47 C25 54 25 62 30 69" fill="none" stroke-width="2.6"/><circle cx="38" cy="59" r="2.4" fill="#1E3B36" stroke="none"/><circle cx="47" cy="58" r="2.4" fill="#1E3B36" stroke="none"/><circle cx="56" cy="58" r="2.4" fill="#1E3B36" stroke="none"/><circle cx="65" cy="58" r="2.4" fill="#1E3B36" stroke="none"/><path d="M38 47 C48 44 58 44 66 46" fill="none" stroke="#fff" stroke-width="3" opacity="0.85"/><circle cx="19" cy="55" r="5.5" fill="#FFFFFF" stroke-width="3"/><circle cx="19.6" cy="55" r="2.5" fill="#1E3B36" stroke="none"/></g></g><text x="88" y="169" class="titre" font-size="16">Sardines au four et courgettes</text><text x="88" y="187" class="sans" font-size="13">Sardine et courgette</text><rect x="536" y="160" width="24" height="24" rx="7" style="animation:b0 7s linear infinite both;fill:#221a20;stroke:#221a20" stroke-width="1.5"/><path pathLength="1" d="M542 172.5l4.5 4.5l8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 1;stroke-dashoffset:0;animation:c0 7s ease-out infinite both"/></g><g class="saute" style="animation-delay:0.37s"><rect x="28" y="206" width="544" height="52" rx="14" fill="#fff" stroke="#d6d9cd"/><g transform="translate(40.0 214.0) scale(0.3214)"><g stroke="#1E3B36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M56 14 C64 14 66 22 66 30 C66 44 64 52 72 62 C84 76 82 100 60 104 C52 106 46 104 40 102 C24 96 26 72 40 62 C48 54 46 44 46 30 C46 22 48 14 56 14Z" fill="#f0b46a" stroke-width="4"/><path d="M52 16 L54 6 L60 6 L60 16" fill="#7a8f4a" stroke-width="3"/><path d="M50 60 C56 64 62 64 66 60" fill="none" stroke-width="2.5" stroke="#c98a3a"/><path d="M40 76 C40 70 42 66 46 64" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.85"/><path d="M52 30 L52 46" fill="none" stroke="#fff" stroke-width="3" opacity="0.85"/></g></g><text x="88" y="229" class="titre" font-size="16">Risotto à la courge et à la sauge</text><text x="88" y="247" class="sans" font-size="13">Courge</text><rect x="536" y="220" width="24" height="24" rx="7" style="animation:b1 7s linear infinite both;fill:#221a20;stroke:#221a20" stroke-width="1.5"/><path pathLength="1" d="M542 232.5l4.5 4.5l8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 1;stroke-dashoffset:0;animation:c1 7s ease-out infinite both"/></g><g class="saute" style="animation-delay:0.49s"><rect x="28" y="266" width="544" height="52" rx="14" fill="#fff" stroke="#d6d9cd"/><g transform="translate(40.0 274.0) scale(0.3214)"><g stroke="#1E3B36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M44 104 C42 80 44 60 50 44 L58 44 C56 60 54 82 54 104Z" fill="#f4ece4" stroke-width="4"/><path d="M60 104 C62 84 66 64 72 50 L78 52 C72 66 70 86 70 104Z" fill="#d6455a" stroke-width="4"/><path d="M48 50 C24 46 16 26 26 14 C36 4 56 6 62 18 C70 30 64 46 48 50Z" fill="#3f7d4e" stroke-width="4"/><path d="M48 50 L40 20 M44 36 L30 30 M46 28 L56 20" fill="none" stroke-width="2.5" stroke="#aad681"/><path d="M74 54 C96 50 104 30 96 20 C88 12 72 14 68 26 C64 36 66 48 74 54Z" fill="#579660" stroke-width="4"/><path d="M74 54 L84 24" fill="none" stroke-width="2.5" stroke="#e88a9a"/></g></g><text x="88" y="289" class="titre" font-size="16">Poêlée de blettes et pois chiches</text><text x="88" y="307" class="sans" font-size="13">Blette et ail</text><rect x="536" y="280" width="24" height="24" rx="7" style="animation:b2 7s linear infinite both;fill:#221a20;stroke:#221a20" stroke-width="1.5"/><path pathLength="1" d="M542 292.5l4.5 4.5l8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 1;stroke-dashoffset:0;animation:c2 7s ease-out infinite both"/></g><g class="monte" style="animation-delay:.8s"><rect x="28" y="328" width="544" height="0" fill="none"/></g></svg>