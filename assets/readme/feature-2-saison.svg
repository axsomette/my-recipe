<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Calcul de saison</title><desc>Frise des douze mois de la recette « Courgettes farcies » : de saison de mai à octobre, octobre encadré.</desc><style>
.titre{font-family:'Young Serif',Georgia,'Times New Roman',serif;fill:#221a20}
.etiq{font-family:'Sofia Sans Extra Condensed','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;font-weight:700;letter-spacing:.08em;fill:#5a5158}
.sans{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#5a5158}
.fort{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#221a20;font-weight:600}
.monte{animation:monte .4s ease-out both}
.saute{transform-box:fill-box;transform-origin:50% 100%;animation:saute .5s cubic-bezier(.34,1.56,.64,1) both}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes monte{0%{opacity:0;transform:translateY(8px)}}
@keyframes saute{0%{opacity:0;transform:translateY(-12px) scale(.9)}55%{opacity:1;transform:translateY(2px) scale(1.05,.95)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scaleY(.2)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><rect x=".5" y=".5" width="599" height="339" rx="18" fill="#f9faf5" stroke="#d6d9cd"/><text x="28" y="40" class="etiq" font-size="14">CALCUL DE SAISON</text><text x="28" y="78" class="titre" font-size="28" letter-spacing="-.3">Chaque recette a ses mois</text><text x="28" y="106" class="sans" font-size="15">La saison se calcule à partir des légumes cochés ;</text><text x="28" y="127" class="sans" font-size="15">les produits de toute l’année n’entrent pas dans le calcul.</text><g class="monte" style="animation-delay:.2s"><text x="28" y="168" class="titre" font-size="22">Courgettes farcies</text><rect x="240" y="150" width="90" height="26" rx="13" fill="#f2decb"/><circle cx="252" cy="163" r="4.5" fill="#A9480F"/><text x="262" y="168" font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#8e3b0b">De saison</text><text x="342" y="168" class="sans" font-size="14">de mai à octobre</text></g><rect x="28.0" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="47.9" y="274" text-anchor="middle" class="etiq" font-size="13">J</text><rect x="73.8" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="93.8" y="274" text-anchor="middle" class="etiq" font-size="13">F</text><rect x="119.7" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="139.6" y="274" text-anchor="middle" class="etiq" font-size="13">M</text><rect x="165.5" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="185.4" y="274" text-anchor="middle" class="etiq" font-size="13">A</text><rect x="211.3" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.40s" x="211.3" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><text x="231.2" y="274" text-anchor="middle" class="etiq" font-size="13">M</text><rect x="257.2" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.49s" x="257.2" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><text x="277.1" y="274" text-anchor="middle" class="etiq" font-size="13">J</text><rect x="303.0" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.58s" x="303.0" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><text x="322.9" y="274" text-anchor="middle" class="etiq" font-size="13">J</text><rect x="348.8" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.67s" x="348.8" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><text x="368.8" y="274" text-anchor="middle" class="etiq" font-size="13">A</text><rect x="394.7" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.76s" x="394.7" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><text x="414.6" y="274" text-anchor="middle" class="etiq" font-size="13">S</text><rect x="440.5" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><rect class="pop" style="animation-delay:0.85s" x="440.5" y="190" width="39.8" height="64" rx="6" fill="#A9480F"/><rect class="monte" style="animation-delay:1.1s" x="438.0" y="187.5" width="44.8" height="69" rx="8" fill="none" stroke="#221a20" stroke-width="2.5"/><text x="460.4" y="274" text-anchor="middle" class="etiq" font-size="13" style="fill:#221a20">O</text><rect x="486.3" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="506.3" y="274" text-anchor="middle" class="etiq" font-size="13">N</text><rect x="532.2" y="190" width="39.8" height="64" rx="6" fill="#e3e6da"/><text x="552.1" y="274" text-anchor="middle" class="etiq" font-size="13">D</text><g class="monte" style="animation-delay:1.3s"><text x="28" y="318" class="fort" font-size="14">En octobre : 1 légume de saison sur 1.</text><text x="292" y="318" class="sans" font-size="14">Steak haché et riz : toute l’année.</text></g></svg>